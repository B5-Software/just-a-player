name: Publish verified build
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full Build run for the exact tagged commit
        type: string
        required: true
      release_tag:
        description: Existing immutable version tag, e.g. v0.1.3
        type: string
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify successful source run, exact commit, version and all 14 jobs
        id: verify
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {execFileSync} from 'node:child_process'
          import {appendFileSync,writeFileSync} from 'node:fs'
          const {SOURCE_RUN_ID:id,RELEASE_TAG:tag,GITHUB_REPOSITORY:repo}=process.env
          assert.match(id,/^[0-9]+$/)
          assert.match(tag,/^v[0-9]+\.[0-9]+\.[0-9]+$/)
          const api=path=>JSON.parse(execFileSync('gh',['api',path],{encoding:'utf8'}))
          const run=api('repos/'+repo+'/actions/runs/'+id)
          assert.equal(run.status,'completed')
          assert.equal(run.conclusion,'success')
          assert.equal(run.event,'push')
          assert.equal(run.head_branch,'main')
          assert.equal(run.path,'.github/workflows/build.yml')
          execFileSync('git',['fetch','--no-tags','origin','refs/tags/'+tag],{stdio:'inherit'})
          const sha=execFileSync('git',['rev-parse','FETCH_HEAD^{commit}'],{encoding:'utf8'}).trim()
          assert.equal(run.head_sha,sha,'Artifact commit must equal the immutable release tag')
          const pkg=JSON.parse(execFileSync('git',['show',sha+':package.json'],{encoding:'utf8'}))
          assert.equal('v'+pkg.version,tag)
          const jobs=api('repos/'+repo+'/actions/runs/'+id+'/jobs?per_page=100').jobs.filter(j=>j.name!=='Publish release')
          assert.equal(jobs.length,14)
          assert(jobs.every(j=>j.conclusion==='success'),'All platform and MIDI combinations must pass')
          const artifacts=api('repos/'+repo+'/actions/runs/'+id+'/artifacts?per_page=100').artifacts.filter(a=>a.name.startsWith('just-a-player-'))
          assert.equal(artifacts.length,14)
          assert(artifacts.every(a=>!a.expired))
          appendFileSync(process.env.GITHUB_OUTPUT,'sha='+sha+'\n')
          writeFileSync(process.env.RUNNER_TEMP+'/release-provenance.json',JSON.stringify({tag,commit:sha,sourceRun:run.html_url,checks:jobs.map(j=>({name:j.name,conclusion:j.conclusion,url:j.html_url})),artifacts:artifacts.map(a=>({name:a.name,digest:a.digest}))},null,2))
          console.log('Verified exact tagged source and all 14 successful build combinations:',sha)
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: just-a-player-*
          path: release-artifacts
          merge-multiple: true
      - name: Corresponding FFmpeg source
        run: node apps/desktop/scripts/prepare-media-tools.mjs --source release-artifacts
      - name: Verify 22 installers, checksums and publish
        shell: bash
        run: |
          cp "$RUNNER_TEMP/release-provenance.json" release-artifacts/BUILD-PROVENANCE.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readdirSync,statSync} from 'node:fs'
          const files=readdirSync('release-artifacts').filter(f=>/\.(exe|dmg|zip|deb|AppImage|apk)$/.test(f))
          assert.equal(files.length,22)
          for(const midi of ['with-midi','without-midi'])assert.equal(files.filter(f=>f.includes(midi)).length,11)
          assert(files.every(f=>f.includes(process.env.RELEASE_TAG.slice(1))&&!/debug/i.test(f)&&statSync('release-artifacts/'+f).size>0))
          console.log('Verified all 22 release installers')
          NODE
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Just A Player $RELEASE_TAG" --notes-file "docs/release-$RELEASE_TAG.md" release-artifacts/*
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/published-assets.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const assets=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/published-assets.json','utf8')).assets
          assert.equal(assets.filter(a=>/\.(exe|dmg|zip|deb|AppImage|apk)$/.test(a.name)).length,22)
          assert(assets.some(a=>a.name==='SHA256SUMS.txt'))
          assert(assets.some(a=>a.name==='BUILD-PROVENANCE.json'))
          NODE
          gh release edit "$RELEASE_TAG" --draft=false
