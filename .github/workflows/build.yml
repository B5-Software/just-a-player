name: Build
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CARGO_BUILD_JOBS: '2'
      JAP_CI_ALLOW_GPU_FALLBACK: ${{ matrix.platform == 'mac' && matrix.arch == 'x64' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify native Node architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}')throw new Error('Unexpected Node architecture '+process.arch); console.log(process.platform,process.arch)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev xvfb libgtk-3-0 libnss3 libgbm1 libxss1
      # Core tests use native fixtures; desktop build acquires checksum-pinned FFmpeg.
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm build
      - run: pnpm typecheck
      - name: Bundled codecs and video export test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:media
      - name: Bundled codecs and video export test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:media
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:smoke
      - name: Desktop smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:smoke
      - name: Playlist restart test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:memory
      - name: Playlist restart test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:memory
      - name: GPU failure isolation test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:fallback
      - name: GPU failure isolation test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:fallback
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./apps/desktop/package.json').version)throw new Error('Tag/package version mismatch')"
      - name: Package
        run: pnpm --filter desktop package --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Packaged application smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:smoke --packaged
      - name: Packaged application smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:smoke --packaged
      - name: Packaged codecs and video export test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:media --packaged
      - name: Packaged codecs and video export test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:media --packaged
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: media-qa-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/test-results/media-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && matrix.platform == 'mac' && matrix.arch == 'x64'
        with:
          name: qa-mac-x64
          if-no-files-found: error
          path: apps/desktop/test-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: apps/desktop/test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: just-a-player-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: just-a-player-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mirror complete FFmpeg corresponding source
        run: node apps/desktop/scripts/prepare-media-tools.mjs --source release-artifacts
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "Just A Player $GITHUB_REF_NAME" --notes-file "../docs/release-$GITHUB_REF_NAME.md" --verify-tag *
