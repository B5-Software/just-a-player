name: Build
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.target.platform }} · ${{ matrix.target.arch }} · ${{ matrix.midi }}
    strategy:
      fail-fast: false
      matrix:
        midi: [with-midi, without-midi]
        target:
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 45
    env:
      JAP_BUNDLE_MIDI: ${{ matrix.midi == 'with-midi' && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CARGO_BUILD_JOBS: '2'
      JAP_CI_ALLOW_GPU_FALLBACK: ${{ matrix.target.platform == 'mac' && matrix.target.arch == 'x64' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify native Node architecture
        run: node -e "if(process.arch !== '${{ matrix.target.arch }}')throw new Error('Unexpected Node architecture '+process.arch); console.log(process.platform,process.arch)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev xvfb libgtk-3-0 libnss3 libgbm1 libxss1
      # Core tests use native fixtures; desktop build acquires checksum-pinned FFmpeg.
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        if: matrix.midi == 'with-midi'
        with:
          path: assets/soundfonts/MuseScore_General_HQ.sf2
          key: midi-hq-0.2.1-${{ runner.os }}
      - run: node scripts/prepare-soundfonts.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm build
      - run: pnpm typecheck
      - name: Bundled codecs and video export test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:media
      - name: Bundled codecs and video export test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:media
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:smoke
      - name: MIDI and touch regression (Windows)
        if: runner.os == 'Windows' && matrix.midi == 'with-midi'
        run: pnpm --filter desktop test:e2e:midi-touch
      - name: Themed dialogs (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter desktop test:e2e:dialogs
      - name: Visual plugins and isolated GPU video export (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm --filter desktop test:e2e:studio
          pnpm --filter desktop test:e2e:discs
          pnpm --filter desktop test:e2e:lyrics
          pnpm --filter desktop test:e2e:export
      - name: Desktop smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:smoke
      - name: Playlist restart test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:memory
      - name: Playlist restart test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:memory
      - name: GPU failure isolation test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:fallback
      - name: GPU failure isolation test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:fallback
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./apps/desktop/package.json').version)throw new Error('Tag/package version mismatch')"
      - name: Package
        run: pnpm --filter desktop package --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
      - name: Packaged MIDI bank / SF2 import
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:midi-package
      - name: Packaged MIDI bank / SF2 import (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:midi-package
      - name: Packaged application smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:smoke --packaged
      - name: Packaged application smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:smoke --packaged
      - name: Packaged codecs and video export test
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:e2e:media --packaged
      - name: Packaged codecs and video export test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop test:e2e:media --packaged
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: media-qa-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.midi }}
          path: apps/desktop/test-results/media-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && matrix.target.platform == 'mac' && matrix.target.arch == 'x64'
        with:
          name: qa-mac-x64-${{ matrix.midi }}
          if-no-files-found: error
          path: apps/desktop/test-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.midi }}
          if-no-files-found: ignore
          path: apps/desktop/test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: just-a-player-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.midi }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
  android:
    name: Android · universal · ${{ matrix.midi }}
    strategy:
      fail-fast: false
      matrix:
        midi: [with-midi, without-midi]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      JAP_CODEC_JOBS: '4'
      JAP_BUNDLE_MIDI: ${{ matrix.midi == 'with-midi' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: actions/cache@v4
        if: matrix.midi == 'with-midi'
        with:
          path: assets/soundfonts/MuseScore_General_HQ.sf2
          key: midi-hq-0.2.1-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: codecs
        with:
          path: apps/android/build/codecs
          key: android-codecs-${{ runner.os }}-${{ hashFiles('apps/android/scripts/build-codecs.sh', 'apps/android/scripts/prepare-codecs.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop typecheck:web
      - name: Prepare persistent release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node apps/android/scripts/prepare-signing.mjs
      - name: Build all four ABIs and QA APK
        run: pnpm --filter android build:debug
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/just-a-player-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node apps/android/scripts/gradle.mjs assembleRelease
      - name: Android native Clippy
        run: node apps/android/scripts/build-native.mjs --clippy x86_64
      - name: Verify universal APK and 16 KiB ELF alignment
        run: node apps/android/scripts/verify-apk.mjs apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Cache verified Android codecs before emulator QA
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/android/build/codecs
          key: android-codecs-${{ runner.os }}-${{ hashFiles('apps/android/scripts/build-codecs.sh', 'apps/android/scripts/prepare-codecs.mjs') }}
      - name: Enable KVM for emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # userdebug images force WebView debugging even for signed releases.
          # Use the production-style user image and exercise real 16 KiB pages.
          target: google_apis_playstore_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: |
            node apps/android/scripts/test-emulator.mjs --install
            node apps/android/scripts/test-hdr-gpu.mjs
            node apps/android/scripts/test-hifi.mjs
            node apps/android/scripts/test-layout.mjs
            node apps/android/scripts/test-touch-midi.mjs
            node apps/android/scripts/test-release.mjs
      - name: Collect signed release APK and corresponding codec source
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p apps/android/release
          cp apps/android/app/build/outputs/apk/release/app-release.apk apps/android/release/Just-A-Player-0.1.2-Android-universal-${{ matrix.midi }}.apk
          cp apps/android/build/codecs/ffmpeg.tar.xz apps/android/release/android-ffmpeg-9.0.2-source.tar.xz
          cp apps/android/build/codecs/x264.tar.gz apps/android/release/android-x264-c24e06c-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android-${{ matrix.midi }}
          path: apps/android/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: just-a-player-android-universal-${{ matrix.midi }}
          path: apps/android/release/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  release:
    name: Publish release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: just-a-player-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mirror complete FFmpeg corresponding source
        run: node apps/desktop/scripts/prepare-media-tools.mjs --source release-artifacts
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release-artifacts
          node -e "const fs=require('fs');const files=fs.readdirSync('.').filter(f=>/\.(exe|dmg|zip|deb|AppImage|apk)$/.test(f));if(files.length!==22||files.filter(f=>f.includes('with-midi')).length!==11||files.filter(f=>f.includes('without-midi')).length!==11||files.some(f=>/debug/i.test(f)))throw Error('Incomplete release: '+files.join(','));console.log('Verified 22 release installers')"
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "Just A Player $GITHUB_REF_NAME" --notes-file "../docs/release-$GITHUB_REF_NAME.md" --verify-tag *
