name: HarmonyOS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hap:
    # Official DevEco SDK/CLI must already be installed and licensed on this host.
    runs-on: [self-hosted, harmonyos-7]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos
      - run: pnpm install --frozen-lockfile
      - run: node apps/harmony/scripts/build-native.mjs --arm64
      - run: node apps/harmony/scripts/build-native.mjs
      - run: pnpm --filter harmony build:web
      - name: Unsigned Release HAP
        working-directory: apps/harmony
        run: pnpm dlx @deveco/deveco-cli@1.3.7 build --build-mode release
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonyOS-0.1.3-preview-unsigned-arm64-x86_64
          path: apps/harmony/entry/build/default/outputs/default/*-unsigned.hap
          if-no-files-found: error
