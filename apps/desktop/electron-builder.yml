appId: B5Software.JustAPlayer
productName: Just A Player
copyright: Copyright © 2026 B5-Software
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.node.*'
  - '!node_modules/@jap/engine/src/**'
  - '!node_modules/@jap/engine/*.rs'
  - '!node_modules/@jap/engine/Cargo.toml'
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
afterPack: scripts/verify-media-package.cjs
extraMetadata:
  name: just-a-player
  version: 0.1.4
# scripts/package.mjs supplies the resource list for each MIDI variant.
# Keep it in one place: Electron Builder concatenates inherited resource arrays.
publish:
  provider: github
  owner: B5-Software
  repo: just-a-player
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Just-A-Player-${version}-win-${arch}.${ext}
nsis:
  include: build/file-associations.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Just A Player
  license: ../../LICENSE
mac:
  fileAssociations:
    - ext: [flac, wav, aiff, aif, mp3, m4a, aac, ogg, oga, opus, mka, caf, alac, dsf, dff, ncm, ape, dts, dtshd, iso, cue, mid, midi, kar, rmi, m3u, m3u8]
      name: Music
      role: Viewer
      rank: Alternate
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.music
  identity: '-'
  hardenedRuntime: false
  artifactName: Just-A-Player-${version}-mac-${arch}.${ext}
  extendInfo:
    NSHighResolutionCapable: true
linux:
  fileAssociations:
    - ext: ncm
      name: Netease Cloud Music
      mimeType: application/x-ncm
    - ext: [dsf, dff]
      name: Direct Stream Digital
      mimeType: audio/x-dsd
  mimeTypes: [audio/mpeg, audio/flac, audio/x-flac, audio/wav, audio/x-wav, audio/x-aiff, audio/mp4, audio/aac, audio/ogg, application/ogg, audio/opus, audio/x-matroska, audio/x-ape, audio/x-dsf, audio/x-dff, audio/vnd.dts, audio/midi, audio/x-midi, audio/rmid, application/x-midi, audio/x-mpegurl, application/vnd.apple.mpegurl, application/x-ncm, application/x-cue, application/x-cd-image, application/x-iso9660-image]
  target:
    - AppImage
    - deb
  executableName: just-a-player
  category: AudioVideo
  icon: build/icon.png
  artifactName: Just-A-Player-${version}-linux-${arch}.${ext}
  maintainer: B5-Software
  synopsis: HiFi music meets immersive visualization
  description: A HiFi music player with native audio outputs, immersive visualizations and 3D lyrics.
deb:
  depends:
    - libasound2
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - libgbm1
    - libgl1
    - libegl1
    - libxkbcommon0
    - libxkbcommon-x11-0
    - libdbus-1-3
