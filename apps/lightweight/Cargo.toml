[package]
name = "jap-lightweight"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
jap-light = { path = "../../crates/jap-light" }
jap-core.workspace = true
jap-engine.workspace = true
jap-decode.workspace = true
serde_json.workspace = true
base64 = "0.22"
anyhow.workspace = true
clap.workspace = true
sha2.workspace = true

[target.'cfg(all(not(target_os = "android"), not(target_env = "ohos")))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland", "rwh_06"] }
egui-winit = { version = "=0.34.3", default-features = false, features = ["x11", "wayland", "clipboard"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
egui_software_backend = { version = "=0.0.3", default-features = false, features = ["std"] }
bytemuck = "1"
raw-window-handle = "0.6"
souvlaki = "0.8.3"
url = "2"
fs2 = "0.4.3"
keepawake = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Shell"] }


[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
zbus = "5"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
