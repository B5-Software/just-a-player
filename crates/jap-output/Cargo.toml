[package]
name = "jap-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jap-core.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Threading", "Win32_System_Com"] }
winreg = "0.55"

[target.'cfg(any(target_os = "macos", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
cpal = "0.18.2"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
alsa = "0.11"

[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
libusb1-sys = { version = "0.7", features = ["vendored"] }
libc = "0.2"

[lints]
workspace = true
